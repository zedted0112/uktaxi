# Copy to /etc/nginx/sites-available/uktaxi-api
# Replace YOUR_API_DOMAIN with api.example.com (or comment server_name and use default for IP-only tests).

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_API_DOMAIN;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: health without /api prefix confusion
    location = /api {
        return 301 /api/;
    }
}

# After certbot, it will add SSL server block or modify this file for HTTPS.
